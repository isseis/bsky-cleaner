name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to release (e.g. v1.2.3)'
        required: true
        type: string
      bootstrap_first_release:
        description: >-
          Skip the existing-tag check. Only for the very first release, when
          the ghcr.io/isseis/bsky-cleaner package does not exist yet and
          `docker manifest inspect` cannot distinguish "no such package" from
          "denied"/network errors, so the check fails closed. Do not use this
          for any release after the first — it bypasses the safeguard against
          overwriting an existing tag.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      resolved_tag: ${{ steps.resolve-tag.outputs.resolved_tag }}
    steps:
      - name: Resolve tag name
        id: resolve-tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            echo "resolved_tag=$PUSH_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "resolved_tag=$DISPATCH_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate tag format
        env:
          TAG: ${{ steps.resolve-tag.outputs.resolved_tag }}
        run: |
          if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: tag '$TAG' does not match semver format vX.Y.Z"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.resolve-tag.outputs.resolved_tag }}

      - name: Resolve short commit SHA
        id: short-sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check existing vX.Y.Z tag
        id: check-tag
        if: ${{ github.event.inputs.bootstrap_first_release != 'true' }}
        env:
          TAG: ${{ steps.resolve-tag.outputs.resolved_tag }}
        run: |
          EXIT_CODE=0
          OUTPUT=$(docker manifest inspect "ghcr.io/isseis/bsky-cleaner:${TAG}" 2>&1) || EXIT_CODE=$?
          printf '%s\n' "$OUTPUT" | bash scripts/check-existing-tag.sh "$EXIT_CODE"

      - name: Warn about skipped existing-tag check
        if: ${{ github.event.inputs.bootstrap_first_release == 'true' }}
        run: |
          echo "::warning::Existing-tag check was skipped via bootstrap_first_release. This must only be used for the very first release."

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          push: false
          load: true
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.resolve-tag.outputs.resolved_tag }}
            COMMIT=${{ steps.short-sha.outputs.sha }}
          tags: bsky-cleaner:release

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build linux/amd64 binary
        env:
          TAG: ${{ steps.resolve-tag.outputs.resolved_tag }}
          COMMIT: ${{ steps.short-sha.outputs.sha }}
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build \
            -ldflags "-X main.version=${TAG} -X main.commit=${COMMIT}" \
            -o dist/bsky-cleaner ./cmd

      - name: Package binary archive
        env:
          TAG: ${{ steps.resolve-tag.outputs.resolved_tag }}
        run: |
          tar czf "dist/bsky-cleaner-${TAG}-linux-amd64.tar.gz" -C dist bsky-cleaner

      - name: Generate checksum file
        env:
          TAG: ${{ steps.resolve-tag.outputs.resolved_tag }}
        run: |
          cd dist && sha256sum "bsky-cleaner-${TAG}-linux-amd64.tar.gz" > SHA256SUMS

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

      - name: Tag and push latest
        run: |
          docker tag bsky-cleaner:release ghcr.io/isseis/bsky-cleaner:latest
          docker push ghcr.io/isseis/bsky-cleaner:latest

      - name: Tag and push major version tag
        env:
          TAG: ${{ steps.resolve-tag.outputs.resolved_tag }}
        run: |
          MAJOR=$(echo "$TAG" | sed 's/^v\([0-9]*\)\..*$/v\1/')
          docker tag bsky-cleaner:release "ghcr.io/isseis/bsky-cleaner:${MAJOR}"
          docker push "ghcr.io/isseis/bsky-cleaner:${MAJOR}"

      - name: Tag and push minor version tag
        env:
          TAG: ${{ steps.resolve-tag.outputs.resolved_tag }}
        run: |
          MINOR=$(echo "$TAG" | sed 's/^v\([0-9]*\.[0-9]*\)\..*$/v\1/')
          docker tag bsky-cleaner:release "ghcr.io/isseis/bsky-cleaner:${MINOR}"
          docker push "ghcr.io/isseis/bsky-cleaner:${MINOR}"

      - name: Tag and push patch version tag (vX.Y.Z)
        env:
          TAG: ${{ steps.resolve-tag.outputs.resolved_tag }}
        run: |
          docker tag bsky-cleaner:release "ghcr.io/isseis/bsky-cleaner:${TAG}"
          docker push "ghcr.io/isseis/bsky-cleaner:${TAG}"

  publish-release:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.resolved_tag }}
        run: |
          DRAFT_FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DRAFT_FLAG="--draft"
          fi
          gh release create "$TAG" \
            "dist/bsky-cleaner-${TAG}-linux-amd64.tar.gz" \
            dist/SHA256SUMS \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            $DRAFT_FLAG
