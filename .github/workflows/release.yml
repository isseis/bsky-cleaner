name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to release (e.g. v1.2.3)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve tag name
        id: resolve-tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "resolved_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "resolved_tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate tag format
        run: |
          TAG="${{ steps.resolve-tag.outputs.resolved_tag }}"
          if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: tag '$TAG' does not match semver format vX.Y.Z"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.resolve-tag.outputs.resolved_tag }}

      - name: Resolve short commit SHA
        id: short-sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check existing vX.Y.Z tag
        id: check-tag
        run: |
          TAG="${{ steps.resolve-tag.outputs.resolved_tag }}"
          EXIT_CODE=0
          OUTPUT=$(docker manifest inspect "ghcr.io/isseis/bsky-cleaner:${TAG}" 2>&1) || EXIT_CODE=$?
          echo "$OUTPUT" | scripts/check-existing-tag.sh "$EXIT_CODE"

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          push: false
          load: true
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.resolve-tag.outputs.resolved_tag }}
            COMMIT=${{ steps.short-sha.outputs.sha }}
          tags: bsky-cleaner:release

      - name: Tag and push latest
        run: |
          docker tag bsky-cleaner:release ghcr.io/isseis/bsky-cleaner:latest
          docker push ghcr.io/isseis/bsky-cleaner:latest

      - name: Tag and push major version tag
        run: |
          TAG="${{ steps.resolve-tag.outputs.resolved_tag }}"
          MAJOR=$(echo "$TAG" | sed 's/^v\([0-9]*\)\..*$/v\1/')
          docker tag bsky-cleaner:release "ghcr.io/isseis/bsky-cleaner:${MAJOR}"
          docker push "ghcr.io/isseis/bsky-cleaner:${MAJOR}"

      - name: Tag and push minor version tag
        run: |
          TAG="${{ steps.resolve-tag.outputs.resolved_tag }}"
          MINOR=$(echo "$TAG" | sed 's/^v\([0-9]*\.[0-9]*\)\..*$/v\1/')
          docker tag bsky-cleaner:release "ghcr.io/isseis/bsky-cleaner:${MINOR}"
          docker push "ghcr.io/isseis/bsky-cleaner:${MINOR}"

      - name: Tag and push patch version tag (vX.Y.Z)
        run: |
          TAG="${{ steps.resolve-tag.outputs.resolved_tag }}"
          docker tag bsky-cleaner:release "ghcr.io/isseis/bsky-cleaner:${TAG}"
          docker push "ghcr.io/isseis/bsky-cleaner:${TAG}"
